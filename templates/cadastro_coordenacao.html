<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro_coordenacao.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Cadastro</title>
</head>

<body>

     <nav class="navbar transparente-header">
        <div class="itens-central">
            <div class="form-check form-check-inline switch-group">
                    <input class="form-check-input" type="checkbox" id="switch-dark-mode" onchange="AlterarTema()">
                    <label class="form-check-label" for="switch-dark-mode">
                        <div class="switch-darkmode">
                            <div class="icons">
                                <i class="fa-solid fa-lightbulb"></i>
                                <i class="fa-solid fa-moon"></i>
                            </div>
                            <div class="circle"></div>
                        </div>
                    </label>
               </div>
        </div>
        
    </nav>

    <main>
        <section>
            <h1>Cadastro</h1>

            <p>PERFIL | SETOR DE APOIO</p>

            <form action="/cadastro-coor" method="post">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome_completo" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p>
                Já possui uma conta?
                <a href="{{ url_for('pag_login_coordenacao') }}">Logue.</a>
            </p>

            <a href="/">Voltar</a>

        </section>
    </main>

    <script src="/static/js/visualizar_itens.js"></script>

</body>
</html>
