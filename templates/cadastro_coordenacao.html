<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro_coordenacao.css') }}">
    <title>Cadastro</title>
</head>

<body>

    <main>
        <section>
            <h1>Cadastro</h1>

            <p>PERFIL | SETOR DE APOIO</p>

            <form action="/cadastro-coor" method="post">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome_completo" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p>
                Já possui uma conta?
                <a href="{{ url_for('pag_login_coordenacao') }}">Logue.</a>
            </p>

            <a href="/">Voltar</a>

        </section>
    </main>

</body>
</html>
