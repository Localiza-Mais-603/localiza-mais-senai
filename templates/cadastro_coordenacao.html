<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro_coordenacao.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Cadastro</title>
</head>

<body>
     <nav class="navbar transparente-header">
        <div class="itens-central">
            <div class="form-check form-check-inline switch-group">
                    <input class="form-check-input" type="checkbox" id="switch-dark-mode" onchange="AlterarTema()">
                    <label class="form-check-label" for="switch-dark-mode">
                        <div class="switch-darkmode">
                            <div class="icons">
                                <i class="fa-solid fa-lightbulb"></i>
                                <i class="fa-solid fa-moon"></i>
                            </div>
                            <div class="circle"></div>
                        </div>
                    </label>
               </div>
        </div>
    </nav>

    <main>
        <section>
            <h1>{{ 'Cadastro Principal' if primeiro_cadastro else 'Novo Coordenador' }}</h1>
            <p>PERFIL | SETOR DE APOIO</p>

            <form action="/cadastro-coor" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome_completo" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Cadastrar</button>
            </form>

            {% if primeiro_cadastro %}
            <p>
                Já possui uma conta?
                <a href="{{ url_for('pag_login_coordenacao') }}?perfil=apoio">Logue.</a>
            </p>
            {% else %}
            <p>
                <a href="{{ url_for('visualizar_itens') }}">← Voltar ao painel</a>
            </p>
            {% endif %}
        </section>
    </main>

    <script src="/static/js/visualizar_itens.js"></script>
    <!-- Script de validação e máscara de CPF -->
    <script src="/static/js/validar_cpf.js"></script>
</body>
</html>
