<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer login</title>
</head>

<body>

    <section class="container-login">

        <div class="container-header">
            <h1>Entrar</h1>
            <h4>PERFIL | ALUNO </h4>
        </div>

        <!-- Futura rota -> cadastro -->
        <div class="container-form">

            <form action="/cadastrar/post" method="post">
                <label for="email">E-mail:</label><br>
                <input id="email" name="email" type="text" placeholder="Digite seu E-mail..."><br>

                <label for="senha">Senha:</label><br>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha..."><br>


                <button type="submit" class="botao">Entrar</button>
            </form>
            <label for="cpf">E-mail:</label><br>
            <input id="cpf" name="cpf" type="text" placeholder="Digite seu CPF..."><br>

            <label for="senha">Senha:</label><br>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha..."><br>


            <button type="submit" class="botao">Entrar</button>

        </form>

        <div class="container-go-back">

            <button type="submit" class="botao">Voltar</button>

            <p>Não possui uma conta? <a href="/cadastrar" class="link-secundario">Cadastre-se</a>
            </p>


            <!-- Estrutura Popup -->
        <div>
            <h2>Recuperar Senha</h2>

            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
            
            <a href=""><button>Enviar Solicitação</button></a>

            <a href=""><button>Voltar</button></a>
        </div>

        </div>

        <div class="container-go-back">
            <p>Esqueceu sua senha? <a href="/recuperar-senha" class="link-secundario">Recuperar senha</a>
            </p>
        </div>



    </section>

</body>

</html>
