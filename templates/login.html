                    <button type="submit" class="btn-entrar">Entrar</button>
                </div>
            </form>

            <footer class="rodape-card">
                <p>Não possui uma conta? <a href="{{ url_for('cadastro_coor') }}" class="link-secundario">Cadastre-se</a></p>
            </footer>
        </section>

        <!-- Form Usuário -->
        <section id="form-usuario" class="container-form active" aria-labelledby="titulo-usuario">
            <header class="container-header">
                <h1>Entrar</h1>
                <h4 id="titulo-usuario">PERFIL | ALUNO</h4>
            </header>

            {% if erro and tipo == 'aluno' %}
                <p class="erro-mensagem">{{ erro }}</p>
            {% endif %}

            <form action="{{ url_for('pag_login_aluno') }}" method="post">
                <label for="email">E-mail:</label>
                <input id="email" name="email" type="text" placeholder="Digite seu E-mail..." required>

                <label for="senha-usuario">Senha:</label>
                <input id="senha-usuario" name="senha" type="password" placeholder="Digite sua senha..." required>

                <div class="acoes-login">
                    <a href="{{ url_for('selecionar_perfil') }}" class="btn-voltar">Voltar</a>
                    <button type="submit" class="btn-entrar">Entrar</button>
                </div>
            </form>

            <footer class="rodape-card">
                <p>Não possui uma conta? <a href="{{ url_for('pag_cadastro') }}" class="link-secundario">Cadastre-se</a></p>
                <p>Esqueceu sua senha? <a href="/recuperar-senha" class="link-secundario">Recuperar senha</a></p>
            </footer>
        </section>

    </main>

</body>

</html>
