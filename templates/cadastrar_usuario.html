<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro_usuario.css') }}">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Cadastro de usuário</title>
</head>
<body>
     <nav class="navbar transparente-header">
        <div class="itens-central">
            <div class="form-check form-check-inline switch-group">
                    <input class="form-check-input" type="checkbox" id="switch-dark-mode" onchange="AlterarTema()">
                    <label class="form-check-label" for="switch-dark-mode">
                        <div class="switch-darkmode">
                            <div class="icons">
                                <i class="fa-solid fa-lightbulb"></i>
                                <i class="fa-solid fa-moon"></i>
                            </div>
                            <div class="circle"></div>
                        </div>
                    </label>
               </div>
        </div>
        
    </nav>

    <form action="/cadastro" method="post">
        <h2>Cadastro de Usuário</h2>

        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome_completo" required>

        <label for="CPF">CPF:</label>
        <input type="text" id="CPF" name="CPF" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="curso">Curso (opcional):</label>
        <input type="text" id="curso" name="curso">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Cadastrar</button>

        <p>
            Já possui uma conta?
            <a href="{{ url_for('pag_login_aluno') }}?perfil=usuario">Logue.</a>
        </p>

    </form>


    <script src="/static/js/visualizar_itens.js"></script>

</body>
</html>
