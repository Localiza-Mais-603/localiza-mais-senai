<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recuperar-senha.css') }}">
    <title>Localiza+</title>
</head>
<body>

   <div class="container">
        <h2>Recuperar Senha</h2>
        <p>Insira o seu endereço de e-mail cadastrado abaixo. Enviaremos um link para você redefinir a sua senha.</p>
    
        <!-- ADICIONADO: Exibição de alertas de erro ou sucesso vindos do Python -->
        {% if erro %}<p style="color: red;">{{ erro }}</p>{% endif %}
        {% if sucesso %}<p style="color: green;">{{ sucesso }}</p>{% endif %}

        <!-- CORRIGIDO: Nome da função mudado para 'pag_recuperar_senha' -->
        <!-- ADICIONADO: onsubmit para ativar o aviso visual de envio -->
        <form action="{{ url_for('pag_recuperar_senha') }}" method="POST" onsubmit="loadingEmail()">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>
            
            <!-- ADICIONADO: id="btn-enviar" para o JavaScript conseguir mudar o texto -->
            <button type="submit" id="btn-enviar">Enviar Link de Recuperação</button>
        </form>

        <div class="footer-links">
            <p>Lembrou a senha? <a href="{{ url_for('pag_login_aluno') }}">Voltar para o login</a></p>
        </div>
    </div>

    <!-- ADICIONADO: Script simples para mudar o texto do botão no clique -->
    <script>
        function loadingEmail() {
            const btn = document.getElementById('btn-enviar');
            btn.innerText = "Enviando e-mail...";
            btn.style.opacity = "0.7";
        }
    </script>
    
</body>
</html>
