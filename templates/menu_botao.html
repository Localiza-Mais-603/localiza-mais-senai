{% if session.get('perfil') %}
<style>
    /* Topo: botão do menu + logo lado a lado */
    .lz-topo { display: flex; align-items: center; gap: 14px; }
    .lz-topo h1 { margin: 0; }

    .lz-menu-btn {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: #024873;
        color: #fff;
        font-size: 1.15rem;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(2, 72, 115, 0.25);
        transition: background 0.15s ease, transform 0.15s ease;
    }

    .lz-menu-btn:hover { background: #0b6a9e; transform: translateY(-1px); }
    .lz-menu-btn:focus-visible { outline: 3px solid #F28705; outline-offset: 2px; }

    /* Fundo escurecido */
    .lz-overlay {
        position: fixed;
        inset: 0;
        z-index: 1040;
        background: rgba(10, 25, 40, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .lz-overlay.aberto { opacity: 1; visibility: visible; }

    /* Painel lateral (sempre claro, legível nos dois temas) */
    .lz-painel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 1041;
        display: flex;
        flex-direction: column;
        width: min(310px, 86vw);
        background: #fff;
        color: #2b2b2b;
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.2);
        transform: translateX(-102%);
        visibility: hidden;
        transition: transform 0.28s ease, visibility 0.28s ease;
    }

    .lz-painel.aberto { transform: none; visibility: visible; }

    @media (prefers-reduced-motion: reduce) {
        .lz-painel, .lz-overlay { transition: none; }
    }

    /* Cabeçalho do painel */
    .lz-cabecalho {
        position: relative;
        padding: 24px 20px 20px;
        color: #fff;
        background: linear-gradient(135deg, #024873 0%, #0b6a9e 100%);
    }

    .lz-marca { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }

    .lz-usuario { display: flex; align-items: center; gap: 12px; margin-top: 16px; }

    .lz-avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #F28705;
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
    }

    .lz-usuario strong { display: block; font-size: 0.95rem; line-height: 1.2; }

    .lz-usuario small {
        font-size: 0.72rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        opacity: 0.85;
    }

    .lz-fechar {
        position: absolute;
        top: 14px;
        right: 14px;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        cursor: pointer;
    }

    .lz-fechar:hover { background: rgba(255, 255, 255, 0.32); }

    /* Lista de opções */
    .lz-nav { flex: 1; overflow-y: auto; padding: 10px 12px; }

    .lz-secao {
        margin: 14px 10px 6px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: #8a8f98;
    }

    .lz-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin-bottom: 2px;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #2b2b2b;
        font: inherit;
        font-size: 0.93rem;
        font-weight: 600;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .lz-item i {
        flex: none;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: rgba(242, 135, 5, 0.14);
        color: #F28705;
        font-size: 0.9rem;
    }

    .lz-item:hover { background: #f3f6f9; color: #024873; }

    .lz-item.ativo { background: #024873; color: #fff; }
    .lz-item.ativo i { background: rgba(255, 255, 255, 0.2); color: #fff; }

    .lz-item:focus-visible { outline: 3px solid #F28705; outline-offset: -2px; }

    .lz-rodape { padding: 10px 12px 16px; border-top: 1px solid #e8ebef; }

    .lz-item.sair { color: #c62828; }
    .lz-item.sair i { background: rgba(220, 53, 69, 0.12); color: #dc3545; }
    .lz-item.sair:hover { background: #fdecee; color: #c62828; }
</style>

<button type="button" class="lz-menu-btn" id="lzMenuBtn"
    aria-label="Abrir menu" aria-controls="lzPainel" aria-expanded="false">
    <i class="fa-solid fa-bars" aria-hidden="true"></i>
</button>
{% endif %}
