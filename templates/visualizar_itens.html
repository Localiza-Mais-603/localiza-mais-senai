
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visualizar Itens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/css/visualizar_itens.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- CABEÇALHO -->

    <nav class="navbar transparente-header">

        <div class="container-fluido">
            <h1>LOCALIZA+</h1>
        </div>

        <div class="itens-central">

            <button onclick="AlterarTema()">Modo</button>

            {% if session.get('perfil') == 'aluno' %}
                <a href="/registro/itens">
                    <button class="botao-formulario">
                        relatar itens
                    </button>
                </a>
            {% endif %}

            <a href="/visualizar-perfil">
                <button class="botao-formulario">
                    perfil
                </button>
            </a>

        </div>

    </nav>


    <!-- DATA E FILTRO -->

    <div class="item-data">

        <label for="data">
            A partir de:
        </label>

        <input type="date"
               name="data"
               value="2026-09-25">

        <button class="btn-abrir" id="btnAbrir">
            filtros
        </button>

    </div>


    <!-- CARDS DOS ITENS -->

    <div class="itens-card">

        {% for item in itens %}

        <div class="card"
             style="width: 20rem;"

             data-categoria="{{ item.id_categoria }}"

             data-item="{{ item.item }}"
             data-descricao="{{ item.descricao }}"
             data-local="{{ item.local }}"
             data-data="{{ item.data }}"
             data-status="{{ item.status }}"

             onclick="abrirCard(this)">


            <div class="card-corpo">

                <h5 class="card-titulo">
                    {{ item.item }}
                </h5>

                <p class="card-text">
                    {{ item.descricao }}
                </p>

            </div>


            {% if session.get('perfil') == 'coordenacao' %}

            <div class="card-botoes-acao">

                <a href="/editar-item-cadastrado"
                   class="btn-editar-card"
                   onclick="event.stopPropagation()">

                    Editar

                </a>


                <button class="btn-excluir-card"
                        onclick="event.stopPropagation()">

                    Excluir

                </button>

            </div>

            {% endif %}

        </div>

        {% endfor %}

    </div>


    <!-- MODAL DO ITEM EM DESTAQUE -->

    <div class="modal-card" id="modalCard">

        <div class="card-destaque"
             onclick="event.stopPropagation()">

            <button class="fechar-card"
                    onclick="fecharCard()">

                X

            </button>


            <h2 id="modalTitulo"></h2>


            <p>
                <strong>Descrição:</strong>
                <span id="modalDescricao"></span>
            </p>


            <p>
                <strong>Local:</strong>
                <span id="modalLocal"></span>
            </p>


            <p>
                <strong>Data:</strong>
                <span id="modalData"></span>
            </p>


            <p>
                <strong>Status:</strong>
                <span id="modalStatus"></span>
            </p>

        </div>

    </div>


    <!-- FILTRO -->

    <div class="grupo-filtro"
         id="janelaFiltro">

        <div class="grupo-conteudo">

            <button class="btn-fechar"
                    id="btnFechar">

                X

            </button>


            <h3>
                Categorias
            </h3>


            <label>

                <input type="checkbox">

                Disponível

            </label>


            <h3>
                Sub-Categorias
            </h3>


            <label>

                <input type="checkbox"
                       class="filtro-categoria"
                       value="1">

                Acessórios

            </label>


            <label>

                <input type="checkbox"
                       class="filtro-categoria"
                       value="2">

                EPI

            </label>


            <label>

                <input type="checkbox"
                       class="filtro-categoria"
                       value="3">

                Roupas

            </label>


            <button onclick="Filtrar()">

                Aplicar Filtro

            </button>

        </div>

    </div>


    <script src="/static/js/visualizar_itens.js"></script>

</body>

</html>
