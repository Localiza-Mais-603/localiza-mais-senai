<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Itens</title>
    <link rel="stylesheet" href="/static/css/registrarItemPerdido.css">
</head>


<body>

    <main>
        <section class="card-principal">

            <h1 class="titulo-principal">SENAI | LOCALIZA+</h1>

            <h2 class="subtitulo">Registro de itens perdidos</h2>


            <form action="/registro/itens" method="post" enctype="multipart/form-data" class="formulario-perda">

                <div class="campo-grupo">
                    <label for="item" class="rotulo">Item perdido: *</label>
                    <input type="text" id="item" name="item" class="entrada-texto" required>
                </div>

                <div class="campo-grupo">
                    <label for="categoria" class="rotulo">Categoria: *</label>
                    <select id="categoria" name="categoria_id" class="entrada-texto" required>
                        <option value="" disabled selected>Selecione uma categoria...</option>
                        {% for categoria in categorias %}
                            <option value="{{ categoria.id }}">{{ categoria.nome }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" id="btn-abrir-modal" class="botao-submit" title="Cadastrar nova categoria">add categoria</button>
                </div>
                
                <div class="campo-grupo">
                    <label for="local" class="rotulo">Local (opcional)</label>
                    <input type="text" id="local" name="local" class="entrada-texto">
                </div>
                
                <div class="campo-grupo">
                    <label for="data" class="rotulo">Data (opcional)</label>
                    <input type="date" id="data" name="data" class="entrada-texto">
                </div>
                
                <div class="campo-grupo">
                    <label for="foto" class="rotulo">Foto (opcional)</label>
                    <input type="file" id="foto" name="foto" class="entrada-texto">
                </div>
                
                <div class="campo-grupo">
                    <label for="descricao" class="rotulo">Descrição *</label>
                    <textarea id="descricao" name="descricao" class="entrada-area-texto" required></textarea>
                </div>
                
                <div class="grupo-botoes">
                    <button type="submit" class="botao-submit">Enviar</button>
                    <button type="reset" class="botao-cancelar">Cancelar</button>
                </div>
                

            </form>

            <a href="/tela/inicial/usuario" class="link-voltar">voltar à página principal</a>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/static/js/modal-registro-item.js"></script>
</body>
</html>
